[package]
name = "cloakkit-core"
version = "1.4.0"
edition = "2021"
description = "CloakKit iOS 侧载安装器核心：Anisette + Apple ID 登录/2FA + 应用令牌，C FFI 供 Swift 桥接"

[lib]
name = "cloakkit_core"
crate-type = ["staticlib"]

[dependencies]
icloud_auth = { path = "../apple-private-apis/icloud-auth" }
omnisette = { path = "../apple-private-apis/omnisette" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
plist = "1.3.1"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
sha2 = "0.10"
hex = "0.4"
serde_json = "1.0"

# 交叉编译目标：aarch64-apple-ios（真机 arm64）
